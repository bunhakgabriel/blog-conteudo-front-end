<link rel="stylesheet" href="../../css/modPrevia.css">

<div id="modal-previa">
    <section class="modal-body">
        <div class="blog-post">
            <h2 class="post-title">{{vm.titulo}}</h2>
            <p>{{vm.conteudo}}</p>
            <img ng-show="vm.imagem" class="post-image" ng-src="{{vm.imagem.url}}" alt="Imagem do artigo">
            <div ng-repeat="topico in vm.topicos">
                <h3 style="font-size: 1.2rem;" class="post-title">{{topico.titulo}}</h3>
                <p>{{topico.conteudo}}</p>
                <img ng-show="topico.imagem" class="post-image" ng-src="{{topico.imagem.url}}" alt="Imagem do artigo">
                <div ng-repeat="subTopico in topico.subTopicos track by $index">
                    <h4 ng-if="subTopico.tipo === 'subtitulo'">{{subTopico.texto}}</h4>
                    <p ng-if="subTopico.tipo === 'paragrafo'">{{subTopico.texto}}</p>
                    <img ng-show="subTopico.imagem" class="post-image" ng-src="{{subTopico.imagem.url}}" alt="Imagem do artigo">
                </div>
            </div>
        </div>
    </section>
    <footer class="modal-footer">
        <button ng-click="close()">Sair</button>
        <button>Salvar</button>
    </footer>
</div>
